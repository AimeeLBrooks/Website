<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weathered Boundaries</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

:root{

--bg:#1B1F1C;
--text:#D8D1C5;
--muted:#A39B90;
--accent:#D8A65D;

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

background:var(--bg);
overflow:hidden;
height:100vh;
font-family:'Inter',sans-serif;

}

/* ---------- INTRO ---------- */

.intro{

position:absolute;
inset:0;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

z-index:10;

text-align:center;

animation:fadeOut 3s ease forwards;
animation-delay:8s;

}

.title{

font-family:'Cormorant Garamond',serif;
font-size:clamp(3rem,7vw,7rem);

font-weight:300;

color:var(--text);

opacity:0;

animation:fadeIn 4s ease forwards;

}

.subtitle{

margin-top:1rem;

letter-spacing:.3em;
text-transform:uppercase;

color:var(--muted);

opacity:0;

animation:fadeIn 4s ease forwards 1s;

}

.statement{

margin-top:2rem;

max-width:700px;

font-size:0.9rem;

line-height:1.8;

color:var(--muted);

padding:0 2rem;

opacity:0;

animation:fadeIn 4s ease forwards 2s;

}

/* ---------- IMAGE ---------- */

.hero{

position:absolute;
inset:0;

opacity:0;

animation:imageFade 4s ease forwards 9s;

}

.hero img{

width:100%;
height:100%;
object-fit:cover;

}

.overlay{

position:absolute;
inset:0;

background:rgba(0,0,0,.35);

}

/* ---------- ENTER ---------- */

.enter{

position:absolute;

bottom:50px;
left:50%;

transform:translateX(-50%);

opacity:0;

z-index:100;

animation:fadeIn 2s ease forwards 12s;

}

.enter a{

text-decoration:none;

color:var(--text);

letter-spacing:.2em;

text-transform:uppercase;

font-size:0.85rem;

transition:.4s;

}

.enter a:hover{

color:var(--accent);

letter-spacing:.3em;

}

/* ---------- ANIMATIONS ---------- */

@keyframes fadeIn{

from{
opacity:0;
}

to{
opacity:1;
}

}

@keyframes fadeOut{

from{
opacity:1;
}

to{
opacity:0;
pointer-events:none;
}

}

@keyframes imageFade{

from{
opacity:0;
transform:scale(1.04);
}

to{
opacity:1;
transform:scale(1);
}

}

</style>

</head>

<body>

<div class="intro">

<h1 class="title">
WEATHERED BOUNDARIES
